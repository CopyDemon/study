<!doctype html>
<html>
<body>
  <h1>simple server</h1>
  <form id="form">
    <p>Choose a file and write to folder</p>
    <input type="file" id="file">
    <button>send</button>
  </form>
  <br>
  <div id="status">Status</div>

  <input type="text" name="" id="readFileName">
  <button id="readFileBtn">Read File</button>
  <div id="readFileContent"></div>
  <script>
    const status = document.getElementById('status');
    const form = document.getElementById('form');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = document.getElementById('file').files[0];   // 真正的 File 对象，不是 .value
      if (!file) { status.textContent = 'pick a file first'; return; }

      status.textContent = 'Uploading...';
      try {
        const res = await fetch('/upload', {
          method: 'POST',
          headers: { 'x-filename': encodeURIComponent(file.name) },
          body: file,                                             // 直接把 File 当 body 发
        });
        const text = await res.text();
        status.textContent = res.ok ? `Uploaded: ${text}` : `Failed: ${text}`;
      } catch (err) {
        status.textContent = `error: ${err}`;
      }
    });



    // read
    const fileName = document.getElementById('readFileName')
    const readFileBtn = document.getElementById('readFileBtn')
    const readFileContent = document.getElementById('readFileContent')
    readFileBtn.addEventListener('click', async (e)=>{
        try{
            e.preventDefault();
            readFileContent.textContent = 'Loading'
            const res = await fetch('/read',{
                method:"POST",
                headers:{'Content-Type':'application/json'},   // 告诉后端这是 JSON，express.json() 才会解析
                body:JSON.stringify({fileName:fileName.value})  // fetch 不会自动转 JSON
            })
            const text = await res.text()
            if(res.ok){
                readFileContent.textContent = text
            }else{
                readFileContent.textContent = 'Fail to get content back!'
            }
        }catch(e){
            console.log(e)
        }
    })
  </script>
</body>
</html>
