# 最基本的反向代理：nginx 监听 80，把请求转发给本机 8080 的 node 服务
# 测试语法:  nginx -t -c $(pwd)/nginx.conf
# 用这个配置启动: sudo nginx -c $(pwd)/nginx.conf      (80 端口需要 sudo)
# 停止:          sudo nginx -s stop

# 日志和 pid 放在项目目录里，这样 nginx -t 和不用 sudo 的测试都能跑
error_log logs/error.log;
pid       logs/nginx.pid;

events {}

http {
    access_log logs/access.log;

    server {
        listen 80;
        server_name localhost;

        # 上传大小上限，和 express.raw({ limit: '50mb' }) 对齐，默认只有 1m
        client_max_body_size 50m;

        location / {
            proxy_pass http://127.0.0.1:8080;

            # 把真实客户端信息透传给 node，不然 req.ip 看到的永远是 127.0.0.1
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
